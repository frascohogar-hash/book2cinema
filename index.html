@keyframes kenburns{
  0%{
    transform:scale(1) translate(0,0)
  }

  100%{
    transform:scale(1.14) translate(-1.5%,-1.5%)
  }
}

.kenburns{
  animation:kenburns 9s ease-in-out infinite alternate
}

@keyframes shimmer{
  0%{
    transform:translateX(-100%)
  }

  100%{
    transform:translateX(250%)
  }
}

.shimmer{
  animation:shimmer 1.1s linear infinite
}

@keyframes pulseDot{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.25;
    transform:scale(.7)
  }
}

.pulse-dot{
  animation:pulseDot 1.2s ease-in-out infinite
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.fade-up{
  animation:fadeUp .35s ease both
}

@keyframes floatOrb{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  50%{
    transform:translate(28px,-22px) scale(1.08)
  }
}

@keyframes floatOrb2{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  50%{
    transform:translate(-26px,20px) scale(1.12)
  }
}

@keyframes gradientShift{
  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }
}

@keyframes neonPulse{
  0%,100%{
    box-shadow:0 0 22px rgba(155,131,255,.35),0 0 42px rgba(85,227,220,.18)
  }

  50%{
    box-shadow:0 0 34px rgba(255,94,168,.45),0 0 58px rgba(155,131,255,.28)
  }
}

@keyframes barFlow{
  0%{
    background-position:0% 50%
  }

  100%{
    background-position:200% 50%
  }
}

  position:absolute;
  border-radius:9999px;
  filter:blur(72px);
  opacity:.55;
  pointer-events:none
}

  width:520px;
  height:520px;
  background:#7a5cff;
  top:-140px;

}

.orb-b{

}

.orb-c{
  width:420px;
  height:420px;

}

.glass{

.neon-border{

}

.neon-btn{

  box-shadow:0 12px 34px rgba(155,131,255,.38),0 0 22px rgba(255,94,168,.22)

.neon-btn:hover{

}

.turbo-mode{

.turbo-mode .orb{

.turbo-mode .glass{

}

.turbo-mode .neon-btn{
  animation-duration:1.6s;

}

.hover-lift{

}

.hover-lift:hover{
  transform:translateY(-2px);
  border-color:rgba(155,131,255,.55);

}

.credits-bar{
